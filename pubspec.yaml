name: north_korea_plate
description: "North Korea's licence plates for the plate_core library — the regional private and government series, diplomatic, military and VIP plates."
version: 0.1.0
repository: https://github.com/ArAd1Beyranvand/north_korea_plate
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.12.0
  plate_alphabet: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# South Korea's Euroband flag, from Wikimedia Commons
# (File:Flag_of_South_Korea.svg); named with `package: 'north_korea_plate'`.
flutter:
  assets:
    - assets/icons/flag_of_south_korea.svg
